# What engine/review/make_packet.py puts in this TEST pack's review packet (AUTHENTICITY.md, section 6).
# MIT licence (this file only). A new language's own packet words: common greetings and numbers;
# sentences: the first four of Swahili's ASR set (Common Voice sentence collector, CC0;
# docs/tts-extension/harness/asr/sentences.json), so the packet and the ASR round trip say the same.

[words]
list = ["habari", "asante", "rafiki", "mtoto", "chakula", "moja", "mbili", "tatu"]

[sentences]
source = "Common Voice sentence collector, sw (CC0), via docs/tts-extension/harness/asr/sentences.json"
list = ["Adhabu ya kaburi aijua maiti", "Afisa mkuu alizundua kituo kikuu cha usalama.",
        "Akili nyingi huondowa maarifa", "Ala! Kumbe ni mchawi hodari"]
