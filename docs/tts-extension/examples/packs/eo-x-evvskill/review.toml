# What engine/review/make_packet.py puts in this TEST pack's review packet (AUTHENTICITY.md, section 6).
# MIT licence (this file only). Words: common greetings and numbers; sentences: the first four of
# Esperanto's ASR set (Common Voice sentence collector, CC0; docs/tts-extension/harness/asr/sentences.json).

[words]
list = ["saluton", "dankon", "amiko", "infano", "manĝaĵo", "unu", "du", "tri"]

[sentences]
source = "Common Voice sentence collector, eo (CC0), via docs/tts-extension/harness/asr/sentences.json"
list = ["Akcepti kontrakton de nekonato ne estis bona ideo!",
        "Al tiuj, kiuj rifuzas sekvi la religion, ni parolos pri la kondamnitaj aksolotloj.",
        "Ateistoj pli ĝuas seksumadon ol religiemuloj.",
        "Bestoj entute havis pli bonajn gustojn."]
