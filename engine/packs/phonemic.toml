# The phonemic reading's language facts (engine/packs/master.py, D98): what the master path takes from the
# language and not from the letter. Read by master.language(); a pack takes the entry of its own tag or of the
# nearest tag above it (en-us-nyc, en-us, en).
#
# [aspirating.<tag>]: whether the language says the voiceless stops its broad transcription writes as plain
# /p t k/ (eSpeak NG's IPA has no ʰ on them) aspirated, word-initially before a stressed vowel. The IPA's plain
# [t] is unaspirated, and the master path says it so (the table's voice onset time) unless the language is
# listed here as aspirating; then a template whose own stop is aspirated keeps its own. A language with its own
# measured onset times (engine/profiles/<tag>.json, voice_onset_time_ms) takes those before either.
# Sources were opened and read on 2026-10-11 (docs/tts-extension/REFERENCES.md, "Phase 12 continued");
# `confidence = "secondary"` marks a fact found only in Wikipedia, `confidence = "inferred"` one inferred from
# related languages with sources; both are the human's answers to Q60 (HUMAN_ANSWERS.md, 2026-10-11) and queued
# for a native reviewer or a primary source. A language not listed takes the IPA's reading (Kurdish: eSpeak NG
# writes its aspirated series pʰ tʰ, so its plain p t are the unaspirated series, Naser & Saaed 2024).

[aspirating.en]
plain_stops_aspirated = true
source = "Lisker & Abramson 1965, Proc. 5th ICPhS, pp. 389-390 (American English); Roach 2004, JIPA 34(2), p. 240 (RP)"
note = "en-029 and en-us-nyc take this entry: no source on aspiration found for Caribbean or New York English"

[aspirating.en-gb-scotland]
plain_stops_aspirated = true
source = "Stuart-Smith et al. 2015 (Glasgow): shorter aspiration than other varieties, 24-50 ms in the vernacular, 61-83 ms for speakers with Scottish parents"
note = "mixed: aspiration shorter than in RP; the template's own aspirated stop kept"

[aspirating.da]
plain_stops_aspirated = true
source = "Grønnum 1998, JIPA 28(1-2), p. 100"

