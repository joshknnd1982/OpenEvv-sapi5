# Tier B: the braces of extIPA and VoQS (a label over a stretch of speech), extIPA's pauses, and the
# labels themselves (DECISIONS.md D83). MIT, as the rest of the table; facts cited, nothing copied.
#
# A label (`kind = "label"`) is a transform of every letter of its class in the stretch its braces
# hold, written as a mark's is; the adapter gives each degree (VoQS's 1 2 3) or step of a ramp a mark
# of its own, which the front-end composes on each letter. A label spelt with other labels (VoQS's V̰
# is V and the creaky voice ̰) names them as `parts' and has no transform of its own. A pause
# (`kind = "pause"`) is said as the engine's own pause annotation, so long.

# ---- the braces themselves ----

