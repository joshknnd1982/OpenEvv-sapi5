[sound."U+02C8"]
ipa = "ˈ"
codepoints = ["U+02C8"]
name = "Marks the syllable that carries the word's main stress. The mark is written before the stressed syllable, not before its vowel."
section = "suprasegmentals"
tier = "A"
kind = "syllable-mark"
stress = "primary"
placement = "before"
state = "MISSING"
level = 1
approximate = false
plan = { decision = "as-is", end_state = "mapped", uses = ["X10"], builds = [] }

[sound."U+02C8".spec]
duration_ratio = { v = 1.6, tag = "derived", rule = "227 / 142 ms: the first syllable of Dutch kanon stressed against unstressed, not accented, 4 M + 6 F (sluijter_vanheuven_1996_jasa Table I, p. 2475)", note = "accented: 254 / 151 = 1.68; stressed syllables are also louder, about 2 dB unaccented and 5 dB accented, the bands above 500 Hz by 5 to 10 dB (pp. 2476, 2482): measured and reported here, the length is what is required (within a quarter)" }

[sound."U+02C8".tests]
checks = ["T-stress"]
proof = "ipa/proofs/U+02C8.json"

