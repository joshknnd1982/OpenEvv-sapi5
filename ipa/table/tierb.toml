[sound."B:U+A78E".spec]
noise = { peak_hz = { v = 2400, tag = "estimated", note = "gordon2002 (Toda, 6 speakers, word-final after a): the male speakers' main noise peak lies between 2 and 4 kHz, lower and broader than the alveolar ɬ's 3 to 4.5 kHz; no peak in Hz is given (centre of gravity 4222 Hz against ɬ's 4164, not significantly different, Table 15). Set under ɬ's 2655 Hz (chong2022)." } }
locus = { F3 = { v = 2488, tag = "derived", rule = "ɬ's F3 locus 2699 Hz (chong2022) x ɭ's F3 / l's F3 (2356 / 2556, punnoose_2010): a retroflex lowers F3, as gordon2002 measured against ɬ (p = .001, Figure 17)" } }
duration = { inherent_ms = { v = 195.4, tag = "literature", ref = "gordon2002", note = "Table 14: mean of 6 speakers (3 F, 3 M), Toda, word-final after a, one token each; ɬ 189.5 in the same table" } }

