# The extIPA lateral fricatives (D68, Q23). The inventory equates them with ɭ̝̊ ɭ̝ ʎ̝̊ ʟ̝̊, but this engine's ̝ on a
# consonant only lowers F1 (no noise), so each is a letter of its own on a fricative carrier, like ɬ and ɮ.

