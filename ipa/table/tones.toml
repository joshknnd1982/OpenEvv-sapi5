codepoints = ["U+030B"]
name = "extra high tone (IPA list name: EXTRA HIGH LEVEL TONE (ACCENT MARK)): pitch, i.e. the rate of vocal-fold vibration, held at the extra high level for the syllable, written as a diacritic over the syllable nucleus"
