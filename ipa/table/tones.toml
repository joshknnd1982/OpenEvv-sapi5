tier = "A"
kind = "tone"
levels = [5]
placement = "over"
equivalent_to = "U+02E5"
state = "mapped"
level = 2
approximate = false
plan = { decision = "as-is", end_state = "mapped", uses = ["X11"], builds = [] }

[sound."U+030B".spec]
pitch = { v = "Chao", tag = "derived", rule = "Chao's five levels are the speaker's own pitch range, 5 its top and 1 its bottom (mok_zuo_wong_2013_lvc p. 342, after Chao 1930 and 1947), and F0 maps to them in equal steps of log frequency over that range, T = 5 (lg f - lg min) / (lg max - lg min) (zhang_liu_2023 p. 408, after Shi 1990 and Zhu 2004): level L lies (L - 1) / 4 of the span above the bottom, in semitones", note = "the target of each point of the tone is the voice's own stave measured on the same syllable in the same run, so the voice's pitch, declination and phrase ending cancel" }
tolerance_steps = { v = 0.5, tag = "derived", rule = "half a level: nearer the level named than either neighbour" }
stave_span_st = { v = 7.65, tag = "derived", rule = "12 log2(140 / 90): the highest and lowest F0 of the Mandarin tones said alone on /ma/ by 8 male Beijing speakers, tone 4 starting near 140 Hz and tone 3 bottoming out about 90 Hz (xu1997 pp. 66-67, Fig. 2; the text gives them as near and about)", note = "the span of the voice's five levels, level 5 above level 1, checked on the ends of the stave (within a quarter)" }

