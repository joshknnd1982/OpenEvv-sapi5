# affricates the template has no phone for, made as the stop released into the fricative's friction (D84,
# Q22's second half): one sound, so that marks on either side compose on it (extIPA's t̼͡θ̼ d̼͡ð̼); the release is
# extIPA's dental fricated release ᶿ (B:U+1DBF), θ's noise; a voiced stop's friction is shorter and over its voice
released = { dedx = { "t͡θ" = { base = "U+0074", mark = "B:U+1DBF", keys = { frel = { v = 75, tag = "derived", rule = "an affricate's friction, as this template's own affricate t͡s has it before its voice (75 ms in dedx's frames, ˈat͡sa), longer than a fricated release's 43 (Q29, D87)" } } }, "d͡ð" = { base = "U+0064", mark = "B:U+1DBF", keys = { frel = { v = 55, tag = "derived", rule = "a voiced affricate's friction, as this template's own d͡ʒ has it (55 ms at its level in dedx's frames, ˈad͡ʒa), longer than a voiced fricated release's 46 (sangster2002) (Q29, D87)" }, frelav = { v = -13, tag = "derived", rule = "the voice under a voiced release, as 𐞞's (D72): a voiced fricative's voice against a vowel's in this template" }, frelaf = { v = 58, tag = "estimated", note = "ð's friction taken at θ's level in this template (θ 58; no level of ð's own friction was measured)" } } } } }
# double articulations (4g, D66): the two stops as realised, one after the other, under one closure
double = { dedx = { "k͡p" = { add = [{ noburst = { v = 1, tag = "derived", rule = "the velar is let go under the labial closure (connell_1991 2.4: in all tokens, 38 ms before the labial on average; maddieson_1995: the velar gesture leads by a few ms): no burst of its own; the release heard is the labial's (connell_1991 p. 113)" }, vot = { v = 0, tag = "derived", rule = "no release of its own, so no voice onset: k's own vot (28) made the layer stretch its breath into the closure (D66)" }, hold = { v = 40, tag = "derived", rule = "with p's 70: one closure 1.12 times the plain p's (the median of [a e u]: 78 against 85, 87 against 68, 75 against 67 ms, measured on the dedx stage, D66), for the 1.10 of connell_1991 Table 1" } }, { hold = { v = 70, tag = "derived", rule = "with k's 40: see the first part" } }] }, "ɡ͡b" = { add = [{ noburst = { v = 1, tag = "derived", rule = "as k͡p's: the velar let go under the labial closure (connell_1991 2.4)" }, hold = { v = 40, tag = "estimated", rule = "with b's 60: one closure 1.25 times the plain b's (the median of [a e u]: 60 against 48, 61 against 49, 66 against 50 ms, measured on the dedx stage, D66); no ɡ͡b closure against b was found (maselli_2024 finds k͡p longer than ɡ͡b, in figures only), so k͡p's ratio range is assumed" } }, { hold = { v = 60, tag = "estimated", rule = "with ɡ's 40: see the first part" }, f2 = { v = 86, tag = "derived", rule = "b's own 92 (the adapter's, D66) x 0.94: the F2 at the vowel's onset after ɡ͡b against after the labial, burns_shaw_2023 Table 1b (Nupe, 1 speaker): 1283/1353, 1602/1727, 1551/1652, 1143/1221 on /a e i u/, mean 0.938; the locus lower than the labial's, as connell_1991 p. 111 describes" } }] } } }
