# the affricates the template has, one phone each: what the pack generator's `says' lines tell the accent layer
# for dedx (C = t S, J = d Z, P = p f, T = t s); a tied pair the template has no phone for is said as its two
# letters in a row by the lookup's fallback, the tie reported as skipped (`ipa-char-skipped', a loss)
