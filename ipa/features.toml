# The features of a sound (DESIGN.md 2.1), MIT licence.
#
# The features follow the IPA chart's own rows and columns, not a binary system, so that every
# chart letter has a bundle of its own and every chart mark is one edit to a bundle. The
# validator (engine/ipa/validate.py) checks both: no two letters share a bundle (unless the chart
# prints them as one thing, `equivalent_to`), and every mark names the features it edits.
#
# A scale lists its values in order; the distance between two values is how many steps apart they
# are. A set lists values with no order. `weights` are what the nearest-letter fallback
# (DESIGN.md 2.3) adds up; they start from the template chooser's cost function
# (engine/espeak_phonemes.py:241-259) and are `estimated`: Phase 4 revisits them.

[consonant]
place = { scale = ["bilabial", "labiodental", "linguolabial", "dental", "alveolar", "postalveolar", "retroflex", "alveolo-palatal", "palatal", "velar", "uvular", "pharyngeal", "epiglottal", "glottal"] }
place2 = { set = ["none", "bilabial", "palatal", "velar", "uvular"], default = "none", note = "a second place: double articulations (w ʍ ɥ ɧ k͡p) and the rear closure of a click" }
stricture = { scale = ["closure", "trill", "tap", "friction", "approximation"] }
nasal = { set = [false, true], default = false }
lateral = { set = [false, true], default = false }
nasalized = { set = [false, true], default = false, note = "the nose open through an oral sound (a nasalized approximant); `nasal` is a closure with the nose open" }
sibilant = { set = [false, true], default = false }
airstream = { set = ["pulmonic", "ejective", "implosive", "click"], default = "pulmonic" }
voicing = { scale = ["voiceless", "breathy", "voiced", "creaky"], extra = ["unspecified"], note = "unspecified: a click letter, whose voicing its accompaniment sets" }
aspiration = { set = ["none", "after", "before", "long-after"], default = "none", note = "before: extIPA's pre-aspiration (ʰp); long-after: its long aspiration (pʰʰ) (Tier B)" }
release = { set = ["plain", "none", "nasal", "lateral"], default = "plain" }
secondary = { list = ["labialized", "palatalized", "velarized", "pharyngealized", "velarized-or-pharyngealized"], default = [], note = "the last is the chart's tilde through a letter (ɫ), which leaves the choice open" }
tongue_part = { set = ["unspecified", "apical", "laminal"], default = "unspecified" }
place_shift = { set = ["none", "advanced", "retracted"], default = "none", note = "part of a step along the place scale" }
stricture_shift = { set = ["none", "raised", "lowered"], default = "none", note = "towards closer or more open stricture" }
tongue_root = { set = ["neutral", "advanced", "retracted"], default = "neutral" }
place_mark = { set = ["none", "bridge-above", "equals-below"], default = "none", note = "extIPA's place marks (Tier B, D69), whose place depends on the letter: bridge above (U+0346) is dentolabial on a labial, interdental with the bridge below on a coronal, bidental on h and ɦ; equals below (U+0347) is labioalveolar on a labial, overtly alveolar on a coronal" }
nasal_friction = { set = [false, true], default = false, note = "extIPA's U+034B (Tier B, D69): turbulent airflow through the nostrils; on a nasal letter a nareal fricative" }
voicing_part = { set = ["whole", "initial", "central", "final", "before", "after"], default = "whole", note = "the stretch of the sound its voicing (or phonation) mark is said over: extIPA's partial voicing and devoicing (initial, central, final), its pre- and post-voicing and creaky offglide (before, after) (Tier B)" }
denasal = { set = ["none", "partial", "lesser"], default = "none", note = "extIPA's U+034A (Tier B): the nasal resonance of a nasal letter reduced, partly (the 2025 chart; a wholly denasal sound is written with the oral letter); lesser: with the parentheses (U+034A U+1ABB)" }
velopharyngeal_friction = { set = [false, true], default = false, note = "extIPA's U+034C (Tier B): noisy airflow through a narrowed velopharyngeal port with the sound" }
whistled = { set = [false, true], default = false, note = "extIPA's U+034E (Tier B): a sibilant with a whistle-like narrow band" }
gesture_offset = { set = ["none", "right", "left"], default = "none", note = "extIPA's U+0354 and U+0355 (Tier B): the main gesture displaced to the (listener's) right or left" }

[vowel]
height = { scale = ["close", "near-close", "close-mid", "mid", "open-mid", "near-open", "open"] }
backness = { scale = ["front", "near-front", "central", "near-back", "back"] }
rounding = { scale = ["unrounded", "rounded"], extra = ["unspecified"], note = "unspecified: ə and ɐ, which the chart prints between the pair" }
rounding_shift = { set = ["none", "more", "less"], default = "none" }
nasalized = { set = [false, true], default = false }
rhotic = { set = [false, true], default = false }
tongue_root = { set = ["neutral", "advanced", "retracted"], default = "neutral" }
quality_shift = { set = ["none", "raised", "lowered", "advanced", "retracted", "centralized", "mid-centralized"], default = "none" }
voicing = { scale = ["voiceless", "breathy", "voiced", "creaky"], default = "voiced" }
voicing_part = { set = ["whole", "initial", "central", "final", "before", "after"], default = "whole", note = "the stretch of the sound its voicing (or phonation) mark is said over: extIPA's partial voicing and devoicing (initial, central, final), its pre- and post-voicing and creaky offglide (before, after) (Tier B)" }

[both]
length = { scale = ["extra-short", "short", "half-long", "long"], default = "short" }
syllabic = { set = ["default", "syllabic", "non-syllabic"], default = "default", note = "default: a vowel is syllabic, a consonant is not" }
articulation_force = { set = ["plain", "strong", "weak"], default = "plain", note = "extIPA's U+0348 and U+0349 (Tier B): more or less forceful articulation, not necessarily fortis or lenis" }
lip_spreading = { set = [false, true], default = false, note = "extIPA's U+034D (Tier B): the lips spread rather than neutral or rounded" }
ingressive = { set = [false, true], default = false, note = "extIPA's U+2193 after a letter (Tier B, read only where extIPA is declared, Q18): the sound made on an inward pulmonic airstream" }
sliding = { set = [false, true], default = false, note = "extIPA's U+0362 (Tier B): one of two articulations moved between within the time of one segment" }

[syllable]
stress = { set = ["none", "secondary", "primary"], default = "none" }
tone = { note = "a sequence of levels 1 (lowest) to 5 (highest), Chao's numerals; a register step up or down before it" }

[boundary]
kind = { set = ["syllable", "linked", "minor", "major", "reiteration"], note = "reiteration: extIPA's backslash (p\\p\\p, Tier B), the sound before it said again" }

# The nearest-letter fallback: a cost for each feature that differs, a place step costing
# `place_step` each. Larger is further. All `estimated` (DESIGN.md 2.3).
[weights]
tag = "estimated"
consonant = { stricture = 8, airstream = 6, nasal = 6, lateral = 4, sibilant = 3, place_step = 1, place2 = 2, voicing = 2 }
vowel = { height_step = 2, backness_step = 2, rounding = 1 }
class = 50
