# What engine/review/make_packet.py puts in this TEST pack's review packet. MIT licence (this file only).
# Words: Finnish numbers and greetings, with the quantity contrast (tuli, tuuli, tulli).
# Sentences: the first four of Finnish's ASR set (Common Voice sentence collector, CC0;
# docs/tts-extension/harness/asr/sentences.json).

[words]
list = ["tuli", "tuuli", "tulli", "kiitos", "hyvää", "yksi", "kaksi", "kolme"]

[sentences]
source = "Common Voice sentence collector, fi (CC0), via docs/tts-extension/harness/asr/sentences.json"
list = ["Hei, Thomas, tulitha sä sitteki.", "Meidän on vietävä Uffe leikkaussalii välittömästi!",
        "Okei, vapautetaa se mies.", "Aakkosjärjestys on tyystin toinen."]