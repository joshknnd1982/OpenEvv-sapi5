# OpenEVV pack: nl-be (PROPOSED, waits for the human's say-so; R18). Southern Standard Dutch as spoken
# in Flanders. It extends nl (Dutch, read by eSpeak NG's gmw/nl voice) and holds only what differs:
# its name and eleven vowels, as proposed overrides with their provenance (adank2004, Table I, the
# Southern Standard Dutch men). NOT made: see [meta] note.

[pack]
tag = "nl-be"
name = "Dutch (Southern Standard, Flanders)"
kind = "dialect"
extends = "nl"
format = 1

[meta]
variety = "Southern Standard Dutch (Belgian Standard Dutch): the vowels of adult male Flemish teachers of Dutch from the central region (Flanders-Brabant: the provinces of Antwerpen and Vlaams-Brabant), read-aloud /sVs/ words, as one published table gives them"
region = "Flanders, Belgium (central region: Antwerpen and Vlaams-Brabant provinces)"
speaker_group = "Adank, van Hout and Smits (2004): Southern Standard Dutch talkers, teachers of Dutch recorded in Flanders-Brabant, stratified for age and gender, 20 talkers; the men's means are used (their table gives N per cell 20, which for two tokens a vowel is read here as 10 men)"
sources = ["eSpeak NG voice gmw/nl", "adank2004"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "Eleven stressed vowels at the Southern Standard Dutch men's steady-state values (the vowel's middle, /sVs/ words) of adank2004 Table I, put at the size of the dedx module's voice. NOT made: the Southern and Northern long mid vowels /e o ø/ differ most in how they move (the paper's Table II, not used: an override sets one steady state); Southern consonants (the paper is about vowels: the softer Southern g and h, the Southern r, devoicing of fricatives); stress, rhythm, intonation; a Flemish lexicon or any tussentaal. Against the same table's Northern men (raw Hz, same paper), seven of the eleven differ by more than 6 per cent in F1 or F2 (/ɑ/ F2 -9.0, /a/ F1 +7.0, /ɛ/ F2 -7.1, /ɪ/ F2 -9.1, /u/ F2 +21.5, /o/ F1 -10.4 and F2 -7.2, /ʏ/ F2 -6.5); the other four (/e ø ɔ y/) are overridden only because the parent's vowel is already off the Southern value and is off the Northern one by a similar amount. Level 2 is check A on the scratch stage."

[ini.Language]
Tag = "nl-be"
Name = "Dutch (Southern Standard, Flanders)"
Order = "1100"

# /ɑ/: Table I of adank2004, Southern Standard Dutch men, F1 555 / F2 1066 Hz (the vowel's middle, /sVs/).
# Put at the module's size with engine/authenticity/normalize.py (factor x0.9704, see the first override).
[[override]]
sound = "ɑ"
phonemes = ["@nl:A"]
state = "proposed"
note = "/ɑ/ of adank2004 Table I (Southern Standard Dutch men), normalized to module dedx"

