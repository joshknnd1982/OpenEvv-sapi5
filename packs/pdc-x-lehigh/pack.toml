region = "south-eastern Pennsylvania, USA (the Lehigh Valley and Berks County)"
speaker_group = "Lutheran and Reformed Pennsylvania Germans, now mostly older speakers since their community largely shifted to English; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
