[engine]
realization = "master"
reader = "espeak:gmw/pdc-x-lehigh"

[ini._top]
_c1 = "; OpenEVV language pack: Pennsylvania Dutch (Lehigh), read by eSpeak NG and spoken by openevv's German module"

