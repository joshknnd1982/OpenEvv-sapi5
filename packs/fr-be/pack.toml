name = "French (Belgium)"
kind = "dialect"
format = 1

[meta]
variety = "Belgian French, the French of Wallonia and Brussels"
region = "Wallonia and the Brussels-Capital Region, Belgium"
speaker_group = "French-speaking Belgians; the source stresses differences by region (Liège, Tournai, Brussels), age and education; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice roa/fr-BE", "bardiaux2016"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
licence = "per NOTICE.md"
note = "imported from languages/fr-be; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: the voice uses the plain French phoneme table; its own rules change the numerals (septante, nonante) and its tunes; the vowel length, [w] for [ɥ] and devoicing the source describes are probably not made"

[engine]
reader = "espeak:roa/fr-BE"
template = "frfx"
realization = "legacy"

[files]
eol = "crlf"

[ini._top]
_c1 = "; OpenEVV language pack: French (Belgium), read by eSpeak NG and spoken by openevv's French module"
_c2 = "; with the language's own sounds, melody and tones."
_c3 = "; Drop a folder like this one into %ProgramData%\\OpenEVV\\languages (or the"
_c4 = "; languages folder of the installation) and its voices appear in every SAPI5"
_c5 = "; program; delete the folder and they are gone. docs/LANGUAGES.md has the format."
_c6 = "; Written by engine/make_espeak_packs.py."
_b7 = ""

