# OpenEVV pack: ca-nw, extends ca: only what differs from ca is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ca-nw <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ca-nw"
name = "Catalan (North-western)"
kind = "dialect"
extends = "ca"
format = 1

[meta]
variety = "North-western Catalan, the western Catalan of Lleida and its area"
region = "western Catalonia (Lleida), Andorra and the Catalan-speaking strip of eastern Aragon (the Franja)"
speaker_group = "Catalan speakers of western Catalonia, Andorra and the Franja; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice roa/ca-nw", "valls2018"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/ca-nw; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: the voice's rules are eSpeak NG's general western ones (ca-va shares them), so it is generic Western Catalan rather than Lleida speech; whether it says final unstressed -a as [ɛ] was not checked"

[engine]
realization = "master"
reader = "espeak:roa/ca-nw"

[ini._top]
_c1 = "; OpenEVV language pack: Catalan (North-western), read by eSpeak NG and spoken by openevv's Castilian Spanish module"

[ini.Language]
Tag = "ca-nw"
Name = "Catalan (North-western)"
Locale = "ca-NW"
Order = "215"

[ini.Frontend]
Voice = "roa/ca-nw"

