# OpenEVV pack: ps-x-yusufzai, extends ps: only what differs from ps is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ps-x-yusufzai <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ps-x-yusufzai"
name = "Pashto (Yusufzai)"
kind = "dialect"
extends = "ps"
format = 1

[meta]
sources = ["eSpeak NG voice ira/ps-x-yusufzai"]
note = "imported from languages/ps-x-yusufzai"

[engine]
reader = "espeak:ira/ps-x-yusufzai"

[ini._top]
_c1 = "; OpenEVV language pack: Pashto (Yusufzai), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ps-x-yusufzai"
Name = "Pashto (Yusufzai)"
Locale = "ps-x-yusufzai"
Order = "303"

[ini.Frontend]
Voice = "ira/ps-x-yusufzai"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Pashto (Yusufzai) (eSpeak NG voice ira/ps-x-yusufzai), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ps:Z", to = "Z", note = "ʒ  (not met)" },
  { kind = "map", name = "@ps:ts", to = "T", note = "ts  (not met)" },
  { kind = "map", name = "@ps:dz", to = "d=s43 z=s44", note = "dz  (not met)" },
  { kind = "map", name = "@ps:S.", to = "S=s34", note = "ʂ  (not met)" },
  { kind = "map", name = "@ps:Z.", to = "Z=s33", note = "ʐ  (not met)" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Pashto (Yusufzai) (eSpeak NG voice ira/ps-x-yusufzai), said with openevv's German.", key = "c1" },
]
