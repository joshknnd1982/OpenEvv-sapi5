# OpenEVV pack: ru-cl, extends ru: only what differs from ru is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ru-cl <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ru-cl"
name = "Russian (Classic)"
kind = "dialect"
extends = "ru"
format = 1

[meta]
sources = ["eSpeak NG voice zle/ru-cl"]
note = "imported from languages/ru-cl"

[engine]
reader = "espeak:zle/ru-cl"

[ini._top]
_c1 = "; OpenEVV language pack: Russian (Classic), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ru-cl"
Name = "Russian (Classic)"
Locale = "ru-CL"
Order = "313"

[ini.Frontend]
Voice = "zle/ru-cl"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Russian (Classic) (eSpeak NG voice zle/ru-cl), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ru:l^", to = "l=s15", note = "ɭ" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Russian (Classic) (eSpeak NG voice zle/ru-cl), said with openevv's German.", key = "c1" },
]
