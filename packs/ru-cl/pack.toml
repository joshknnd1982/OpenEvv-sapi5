# OpenEVV pack: ru-cl, extends ru: only what differs from ru is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ru-cl <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ru-cl"
name = "Russian (Classic)"
kind = "dialect"
extends = "ru"
format = 1

[meta]
variety = "eSpeak NG's 'Russian (classic)': Standard Russian with a few spelling-to-sound rules changed (l and n before soft vowels, stress of не́ был and a few words); no documented norm stands behind the name"
region = "Russia and the former USSR, as standard Russian"
speaker_group = "speakers of Standard Russian; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice zle/ru-cl", "yanushevskaya2015"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/ru-cl; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: 'classic' is not shown to be the old Moscow norm: the variant came with eSpeak NG pull request 1459 (2022) with no description; the source describes the standard and the older norms, not this variant"

[engine]
realization = "master"
reader = "espeak:zle/ru-cl"

[ini._top]
_c1 = "; OpenEVV language pack: Russian (Classic), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ru-cl"
Name = "Russian (Classic)"
Locale = "ru-CL"
Order = "313"

[ini.Frontend]
Voice = "zle/ru-cl"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Russian (Classic) (eSpeak NG voice zle/ru-cl), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ru:l^", to = "l=s15", note = "ɭ" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Russian (Classic) (eSpeak NG voice zle/ru-cl), said with openevv's German.", key = "c1" },
]

# ---- the master path: written by engine/packs/to_master.py; run it again rather than editing ----
[master]
note = "switched to the IPA master table's sounds on 2026-10-12 (Phase 11, playbook R21); realization = \"legacy\" goes back"

[master.ipa]

[master.kind]

[master.reading]

[master.fallback]

[master.length]
