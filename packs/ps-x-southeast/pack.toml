# OpenEVV pack: ps-x-southeast, extends ps: only what differs from ps is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ps-x-southeast <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ps-x-southeast"
name = "Pashto (Southeastern)"
kind = "dialect"
extends = "ps"
format = 1

[meta]
variety = "Southeastern (Quetta, Kakar) Pashto"
region = "northern Balochistan around Quetta and southern Khyber Pakhtunkhwa (Bannu, Waziristan)"
speaker_group = "Pashto speakers of the Kakar, Achakzai, Sherani, Tarin, Waziri and Bannuchi areas; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice ira/ps-x-southeast", "appen2016", "dinakhel2020"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/ps-x-southeast; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: the voice matches both sources; the group is not uniform (Waziri keeps Kandahari-like retroflexes, dinakhel2020)"

[engine]
realization = "master"
reader = "espeak:ira/ps-x-southeast"

[ini._top]
_c1 = "; OpenEVV language pack: Pashto (Southeastern), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ps-x-southeast"
Name = "Pashto (Southeastern)"
Locale = "ps-x-southeast"
Order = "302"

[ini.Frontend]
Voice = "ira/ps-x-southeast"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Pashto (Southeastern) (eSpeak NG voice ira/ps-x-southeast), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ps:S.", to = "S=s34", note = "ʂ  (not met)" },
  { kind = "map", name = "@ps:Z.", to = "Z=s33", note = "ʐ  (not met)" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Pashto (Southeastern) (eSpeak NG voice ira/ps-x-southeast), said with openevv's German.", key = "c1" },
]

# ---- the master path: written by engine/packs/to_master.py; run it again rather than editing ----
[master]
note = "switched to the IPA master table's sounds on 2026-10-12 (Phase 11, playbook R21); realization = \"legacy\" goes back"

[master.ipa]

[master.kind]

[master.reading]

