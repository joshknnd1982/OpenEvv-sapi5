# OpenEVV pack: ps-x-southeast, extends ps: only what differs from ps is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ps-x-southeast <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ps-x-southeast"
name = "Pashto (Southeastern)"
kind = "dialect"
extends = "ps"
format = 1

[meta]
sources = ["eSpeak NG voice ira/ps-x-southeast"]
note = "imported from languages/ps-x-southeast"

[engine]
reader = "espeak:ira/ps-x-southeast"

[ini._top]
_c1 = "; OpenEVV language pack: Pashto (Southeastern), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ps-x-southeast"
Name = "Pashto (Southeastern)"
Locale = "ps-x-southeast"
Order = "302"

[ini.Frontend]
Voice = "ira/ps-x-southeast"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Pashto (Southeastern) (eSpeak NG voice ira/ps-x-southeast), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ps:S.", to = "S=s34", note = "ʂ  (not met)" },
  { kind = "map", name = "@ps:Z.", to = "Z=s33", note = "ʐ  (not met)" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Pashto (Southeastern) (eSpeak NG voice ira/ps-x-southeast), said with openevv's German.", key = "c1" },
]
