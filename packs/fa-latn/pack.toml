# OpenEVV pack: fa-latn, extends fa: only what differs from fa is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain fa-latn <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "fa-latn"
name = "Persian (Pinglish)"
kind = "language"
extends = "fa"
format = 1

[meta]
sources = ["eSpeak NG voice ira/fa-Latn"]
note = "imported from languages/fa-latn; a spelling of Persian (Pinglish, Latin letters), not a variety: kind language (OPEN_QUESTIONS.md Q41, DECISIONS.md D91)"

[engine]
reader = "espeak:ira/fa-Latn"

[ini._top]
_c1 = "; OpenEVV language pack: Persian (Pinglish), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "fa-latn"
Name = "Persian (Pinglish)"
Locale = "fa-Latn"
Order = "237"

[ini.Frontend]
Voice = "ira/fa-Latn"

[sample]
text = "Salam, hale shoma chetor ast?"

