region = "Holmes County, Ohio; Kalona, Iowa; Elkhart-LaGrange, Indiana; Arthur, Illinois"
speaker_group = "members of Amish and other plain Anabaptist communities of the Midwest who speak the language at home; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice gmw/pdc-x-midwest", "keiser2000"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/pdc-x-midwest; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: the source confirms the voice's ei rule and the loss in schtarick; the voice merges communities the source shows to differ (Ohio more advanced than Iowa)"

[engine]
reader = "espeak:gmw/pdc-x-midwest"

[ini._top]
_c1 = "; OpenEVV language pack: Pennsylvania Dutch (Midwest), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "pdc-x-midwest"
Name = "Pennsylvania Dutch (Midwest)"
Locale = "pdc-x-midwest"
Order = "298"

[ini.Frontend]
Voice = "gmw/pdc-x-midwest"

[sample]
text = "Gschwei Schprooch zehe Regge saage glaawe gewwe darich"

