# OpenEVV pack: vi-vn-x-central, extends vi: only what differs from vi is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain vi-vn-x-central <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "vi-vn-x-central"
name = "Vietnamese (Central)"
kind = "dialect"
extends = "vi"
format = 1

[meta]
variety = "Central Vietnamese as spoken around Huế"
region = "central Vietnam, centred on Huế (Thừa Thiên Huế)"
speaker_group = "native Vietnamese speakers of the Central dialects; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice aav/vi-VN-x-central", "jewell2022"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/vi-vn-x-central; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: WEAK SOURCE: an undergraduate thesis relying on Vũ 1982 (not reached); the voice's phoneme table (vi-hue) models Huế specifically"

[engine]
realization = "master"
reader = "espeak:aav/vi-VN-x-central"

[ini._top]
_c1 = "; OpenEVV language pack: Vietnamese (Central), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "vi-vn-x-central"
Name = "Vietnamese (Central)"
Locale = "vi-VN-x-central"
Order = "340"

[ini.Frontend]
Voice = "aav/vi-VN-x-central"

