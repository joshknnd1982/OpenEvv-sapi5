# OpenEVV pack: mn-f, extends mn: only what differs from mn is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain mn-f <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "mn-f"
name = "Ankhmaa"
kind = "dialect"
extends = "mn"
format = 1

[meta]
sources = ["eSpeak NG voice xgn/mn-f"]
note = "imported from languages/mn-f"

[engine]
reader = "espeak:xgn/mn-f"

[ini._top]
_c1 = "; OpenEVV language pack: Ankhmaa, read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "mn-f"
Name = "Ankhmaa"
Order = "281"

[ini.Frontend]
Voice = "xgn/mn-f"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Ankhmaa (eSpeak NG voice xgn/mn-f), spoken by openevv's German module", key = "c1" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Ankhmaa (eSpeak NG voice xgn/mn-f), said with openevv's German.", key = "c1" },
]
