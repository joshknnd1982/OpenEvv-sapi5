# OpenEVV pack: mn-f, extends mn: only what differs from mn is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain mn-f <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "mn-f"
name = "Ankhmaa"
kind = "language"
extends = "mn"
format = 1

[meta]
sources = ["eSpeak NG voice xgn/mn-f"]
note = "imported from languages/mn-f; a voice of Mongolian (eSpeak NG's female voice Ankhmaa: pitch and formant scaling), not a variety: kind language (OPEN_QUESTIONS.md Q41, DECISIONS.md D91)"

[engine]
realization = "master"
reader = "espeak:xgn/mn-f"

[ini._top]
_c1 = "; OpenEVV language pack: Ankhmaa, read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "mn-f"
Name = "Ankhmaa"
Order = "281"

[ini.Frontend]
Voice = "xgn/mn-f"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Ankhmaa (eSpeak NG voice xgn/mn-f), spoken by openevv's German module", key = "c1" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Ankhmaa (eSpeak NG voice xgn/mn-f), said with openevv's German.", key = "c1" },
]

# ---- the master path: written by engine/packs/to_master.py; run it again rather than editing ----
[master]
note = "switched to the IPA master table's sounds on 2026-10-12 (Phase 11, playbook R21); realization = \"legacy\" goes back"

[master.ipa]

[master.kind]

[master.reading]

[master.fallback]

[master.length]
