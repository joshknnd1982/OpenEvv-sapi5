# OpenEVV pack: ps-x-northwest, extends ps: only what differs from ps is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain ps-x-northwest <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "ps-x-northwest"
name = "Pashto (Northwestern)"
kind = "dialect"
extends = "ps"
format = 1

[meta]
sources = ["eSpeak NG voice ira/ps-x-northwest"]
note = "imported from languages/ps-x-northwest"

[engine]
reader = "espeak:ira/ps-x-northwest"

[ini._top]
_c1 = "; OpenEVV language pack: Pashto (Northwestern), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "ps-x-northwest"
Name = "Pashto (Northwestern)"
Locale = "ps-x-northwest"
Order = "301"

[ini.Frontend]
Voice = "ira/ps-x-northwest"

[sounds]
line = [
  { kind = "comment", text = "# OpenEVV sound map: Pashto (Northwestern) (eSpeak NG voice ira/ps-x-northwest), spoken by openevv's German module", key = "c1" },
  { kind = "map", name = "@ps:J^", to = "X=s37", note = "ʝ" },
  { kind = "map", name = "@ps:C", to = "X", note = "ç" },
  { kind = "map", name = "@ps:ts", to = "T", note = "ts  (not met)" },
  { kind = "map", name = "@ps:dz", to = "d=s43 z=s44", note = "dz  (not met)" },
  { kind = "map", name = "@ps:S.", to = "S=s34", note = "ʂ  (not met)" },
  { kind = "map", name = "@ps:Z.", to = "Z=s33", note = "ʐ  (not met)" },
]

[phonemes]
line = [
  { kind = "comment", text = "# OpenEVV phoneme map: Pashto (Northwestern) (eSpeak NG voice ira/ps-x-northwest), said with openevv's German.", key = "c1" },
]
