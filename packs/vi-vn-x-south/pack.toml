# OpenEVV pack: vi-vn-x-south, extends vi: only what differs from vi is written here
# (docs/tts-extension/DESIGN.md 6.3). `python engine/packs/build_packs.py explain vi-vn-x-south <key>` says
# which pack of the chain a value of the finished pack comes from.

[pack]
tag = "vi-vn-x-south"
name = "Vietnamese (Southern)"
kind = "dialect"
extends = "vi"
format = 1

[meta]
variety = "Southern Vietnamese as spoken around Hồ Chí Minh City (Saigon)"
region = "southern Vietnam, centred on Hồ Chí Minh City"
speaker_group = "native Vietnamese speakers of the Southern dialects, in Vietnam and abroad; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice aav/vi-VN-x-south", "jewell2022"]
recordings = []
date = "2026-10-11"
status = { level = 2, validated_by = "", date = "" }
note = "imported from languages/vi-vn-x-south; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: WEAK SOURCE: the same undergraduate thesis as the Central pack; a Saigon-specific primary source would be better; the voice's table is vi-sgn"

[engine]
reader = "espeak:aav/vi-VN-x-south"

[ini._top]
_c1 = "; OpenEVV language pack: Vietnamese (Southern), read by eSpeak NG and spoken by openevv's German module"

[ini.Language]
Tag = "vi-vn-x-south"
Name = "Vietnamese (Southern)"
Locale = "vi-VN-x-south"
Order = "341"

[ini.Frontend]
Voice = "aav/vi-VN-x-south"

