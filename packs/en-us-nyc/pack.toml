region = "New York City and Hudson County NJ, with an inner ring including Nassau County"
speaker_group = "people raised in New York City and its inner suburbs who speak the local accent, which is weakening among younger speakers; nothing in this pack was measured from speakers: its sounds are eSpeak NG's reading"
sources = ["eSpeak NG voice gmw/en-US-nyc", "shapp2019"]
