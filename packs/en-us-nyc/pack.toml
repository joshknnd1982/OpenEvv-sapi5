note = "imported from languages/en-us-nyc; [meta] filled in Phase 8 (Q41, D91) from the sources named, opened 2026-10-11. Doubts: the voice's short-a rule is close to the traditional split but does not exclude function words or word-initial cases; whether it is r-less was not checked"

[engine]
