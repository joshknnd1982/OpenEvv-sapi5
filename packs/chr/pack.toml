# OpenEVV pack: chr. Written by engine/packs/import_packs.py from languages/chr/ (stage M1,
# docs/tts-extension/DESIGN.md 11.3); engine/packs/packlib.py says what each part means.
# realization = "legacy": the sound lines below are the ones the generator wrote; edit freely, then
# `python engine/packs/build_packs.py check` says whether the folder in languages/ still agrees.

[pack]
tag = "chr"
name = "Cherokee"
kind = "language"
format = 1

[meta]
sources = ["eSpeak NG voice iro/chr"]
licence = "per NOTICE.md"
note = "imported from languages/chr"

[engine]
reader = "espeak:iro/chr"
template = "enux"
realization = "master"

[files]
eol = "crlf"

[ini._top]
_c1 = "; OpenEVV language pack: Cherokee, read by eSpeak NG and spoken by openevv's US English module"
_c2 = "; with the language's own sounds, melody and tones."
_c3 = "; Drop a folder like this one into %ProgramData%\\OpenEVV\\languages (or the"
_c4 = "; languages folder of the installation) and its voices appear in every SAPI5"
_c5 = "; program; delete the folder and they are gone. docs/LANGUAGES.md has the format."
_c6 = "; Written by engine/make_espeak_packs.py."
_b7 = ""

[ini.Language]
Tag = "chr"
Name = "Cherokee"
Id = "0x00010000"
LCID = "45C"
Locale = "chr-US-Qaaa-x-West"
Codepage = "65001"
Template = "enux"
Order = "217"
Experimental = "1"
_b10 = ""

[ini.Frontend]
_c1 = "; eSpeak NG reads the text; its phonemes are said with the template's phones,"
_c2 = "; each as the language's own sound (Sounds=). Map= is the map of 1.1, the"
_c3 = "; nearest phones only, for a program of 1.1 still running through an upgrade."
Engine = "espeak"
Voice = "iro/chr"
Map = "phonemes.map"
Sounds = "sounds.map"
_b8 = ""

