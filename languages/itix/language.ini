; OpenEVV language pack: Module: international, from Italian.
; Drop a folder like this one into %ProgramData%\OpenEVV\languages (or the
; languages folder of the installation) and its voices appear in every SAPI5
; program; delete the folder and they are gone. docs/LANGUAGES.md has the format.

[Language]
Tag=itix
Name=Module: international, from Italian
Id=0x00050000
LCID=410
Locale=it-IT
Codepage=65001
Module32=openevv-itix-x86.dll
Module64=openevv-itix-x64.dll
Order=911
Experimental=0
; lends its modules to the languages eSpeak NG reads, and is not a language itself
Hidden=1

[Voice1]
Name=Adult Male 1
Gender=Male
Age=Adult
; gender, head size, pitch, inflection, roughness, breathiness, speed, volume
