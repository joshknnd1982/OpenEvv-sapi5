; OpenEVV language pack: Pashto, read by eSpeak NG and spoken by openevv's German.
; Drop a folder like this one into %ProgramData%\OpenEVV\languages (or the
; languages folder of the installation) and its voices appear in every SAPI5
; program; delete the folder and they are gone. docs/LANGUAGES.md has the format.
; Written by engine/make_espeak_packs.py.

[Language]
Tag=ps
Name=Pashto
Id=0x00040000
LCID=463
Locale=ps
Codepage=65001
Template=dede
Order=300
Experimental=1

[Frontend]
; eSpeak NG reads the text; its phonemes are said with the template's
Engine=espeak
Voice=ira/ps
Map=phonemes.map

[Voice1]
Name=Adult Male 1
Gender=Male
Age=Adult
; gender, head size, pitch, inflection, roughness, breathiness, speed, volume
